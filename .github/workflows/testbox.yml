# A Blacksmith testbox: a warm Linux x64 runner that runs builds and tests against the local tree
# (scripts/goport/testbox.sh). `blacksmith testbox warmup` dispatches this workflow, `testbox run` syncs
# the working tree to it and runs one command. The setup matches the Linux test job of ci.yml, with
# zbook's toolchains. Sticky disks keep target/ and the cargo registry warm between testboxes.
# A pull request that changes this file, testbox-data.sh or testbox-data.txt runs it in validation mode (no testbox_id).
# Validation mode commits no sticky disk: it does not mount target/ or the cargo registry, and it mounts
# the data disks with commit: false. A PR run uses the PR's copy of this file, so this only stops mistakes.
# Blacksmith's "Sticky Disks: branch protection" (dashboard Settings > Caching) stops a hostile PR: with it
# on, only push, schedule and workflow_dispatch jobs on main commit.
name: Blacksmith Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
  pull_request:
    paths:
      - ".github/workflows/testbox.yml"
      - "scripts/goport/testbox-data.sh"
      - "scripts/goport/testbox-data.txt"

permissions:
  contents: read

concurrency:
  group: testbox-${{ inputs.testbox_id || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The toolchain of shipped bins (release.yml) and the candidate evidence. Edit-loop builds use the
  # nightly of scripts/run-cargo-capped.sh.
  RUSTUP_TOOLCHAIN: 1.95.0
  NIGHTLY_TOOLCHAIN: nightly-2026-06-17

jobs:
  testbox:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 360
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # After checkout: its clean step would empty a disk mounted in the workspace. A sticky disk commits only
      # when the job ends with no failed or cancelled step: the idle timeout end requests a commit (testbox.sh
      # release; not every request lands, see scripts/goport/README.md), `blacksmith testbox stop` cancels the
      # job and does not (testbox.sh stop). Validation mode does not mount these two.
      - uses: useblacksmith/stickydisk@v1
        if: github.event_name != 'pull_request'
        with:
          key: ts-rust-testbox-target
          path: ${{ github.workspace }}/target
      - uses: useblacksmith/stickydisk@v1
        if: github.event_name != 'pull_request'
        with:
          key: ts-rust-testbox-cargo
          path: ~/.cargo/registry
      # np-suite needs Node 22 or newer; npm ci below needs node.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # main's Go pin is the saved state's batch.upstreamPin.to (AGENTS.md, "Pin"). The Go checkout sits
      # outside the workspace, so a sync of the local tree does not touch it.
      - name: Resolve the Go pin
        id: pin
        run: |
          key=$(jq -r '.batch.upstreamPin.to // empty' docs/typechecker-state/current.json)
          python3 scripts/upstream/pin.py show ${key:+"$key"} > "$RUNNER_TEMP/pin.json"
          jq -r '"key=\(.key)", "repo=\(.repo)", "commit=\(.commit)", "subdir=\(.subdir // "")", "go=\(.oracle.go | ltrimstr("go"))"' "$RUNNER_TEMP/pin.json" >> "$GITHUB_OUTPUT"
      # The zbook files of the gate and the LSP and API oracles (scripts/goport/testbox-data.txt), filled by
      # `testbox.sh seed`. on-change: a testbox that only reads them does not commit an older copy. Validation
      # mode mounts them with commit: false, so testbox-data.sh mount runs on the real disks and its writes drop.
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ts-rust-testbox-inputs
          path: ~/goport-data/inputs
          commit: ${{ github.event_name == 'pull_request' && 'false' || 'on-change' }}
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ts-rust-testbox-pin-${{ steps.pin.outputs.key }}
          path: ~/goport-data/pin
          commit: ${{ github.event_name == 'pull_request' && 'false' || 'on-change' }}
      # The whole repo, not only the Go subdir: np-suite reads packages/typescript and the root node_modules.
      - name: Check out the pinned Go source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: go-pin
          persist-credentials: false
      - name: Install the Go repo's node_modules
        run: |
          (cd go-pin && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error)
          mv go-pin "$HOME/go-pin"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.pin.outputs.go }}
          cache: false
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal
          # Remote commands run without this job's RUSTUP_TOOLCHAIN, so the shipped toolchain is the default
          # (candidate.sh and build-goport-tests.sh pin it too); run-cargo-capped.sh picks the nightly for
          # edit-loop builds.
          rustup default "$RUSTUP_TOOLCHAIN"
      # bubblewrap for GOPORT_PIN runs (scripts/upstream/pin.py exec), psutil for gate.sh.
      - name: Set up zbook's layout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap python3-psutil
          scripts/goport/testbox-data.sh mount ~/goport-data
      # testbox.sh sources this file before each command: commands run over SSH, without this job's env.
      # TS_CARGO_CGROUP_ACTIVE=1 skips the systemd user scope of run-cargo-capped.sh (no user session here).
      # HOME=/home/theo: the gate and the oracles read ~/.local/bin and ~/.explore at zbook's paths.
      # GOPORT_TESTS_JOBS=5: goport-tests.sh runs the go_baselines run and its 4 shards at once (32 vCPU).
      - name: Write the testbox env
        env:
          SUBDIR: ${{ steps.pin.outputs.subdir }}
        run: |
          cat > "$HOME/testbox.env" <<EOF
          export PATH="$(dirname "$(command -v go)"):$(dirname "$(command -v node)"):$HOME/.cargo/bin:\$PATH"
          export CARGO_TERM_COLOR=always
          export TS_GO_REPO="$HOME/go-pin${SUBDIR:+/$SUBDIR}"
          export TSCTEST_TMP="$RUNNER_TEMP/tsctest"
          export COMPILER_RUNNER_TMP="$RUNNER_TEMP/compiler-runner"
          export TS_CARGO_CGROUP_ACTIVE=1
          export TS_CARGO_JOBS=32
          # jemalloc's configure takes LG_VADDR from the build CPU (cpuid 0x80000008): 57 on some testbox
          # hosts, 48 on the others and on zbook and dbook-lan. 48 makes a build's bytes host-independent.
          export JEMALLOC_SYS_WITH_LG_VADDR=48
          export TS_CARGO_SLOTS=1
          export GOPORT_TESTS_JOBS=5
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" HOME=/home/theo
          export PYTHONDONTWRITEBYTECODE=1
          EOF
          cat "$HOME/testbox.env"
      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
      # Before the sticky disks unmount and commit.
      - name: Undo zbook's layout
        if: always()
        run: scripts/goport/testbox-data.sh umount
