# Builds, packs and tests the tsc-rs release: the npm packages tsc-rs, @tsc-rs/linux-x64,
# @tsc-rs/linux-arm64, @tsc-rs/darwin-arm64 and @tsc-rs/win32-x64, and one standalone archive per
# platform (tsc and the lib files; a .zip with tsc.exe for Windows).
#
# A tag v<version> also publishes the npm packages and creates a GitHub release. A stable version
# (v0.1.0) goes to the dist-tag `latest` and a normal release. A prerelease version (v0.2.0-beta.1)
# goes to `next` and a GitHub prerelease. npm trusted publishing (OIDC) authenticates the
# publish: no npm token. Each of the 5 packages trusts this workflow file and the environment `npm`
# (npm/README.md, "Trusted publishing"). Pull requests that change the release files, and a manual
# run, do everything but the release and the publish.
#
# The tsc is a PGO build of the shipped profile (fat LTO), trained on each platform:
# crates/ts_goport/scripts/build-pgo.sh with the training set of scripts/goport/pgo-train.sh (7
# projects at fixed commits). The job also builds the plain tsc, and fails unless the PGO tsc gives
# the same stdout, stderr, exit code and emitted files as the plain tsc on that set. No BOLT
# (build-release.sh has it): BOLT refuses the static Linux bin (build-bolt.sh), its Mach-O support
# is experimental, macOS has no perf branch sampling for its profile, and BOLT has no PE support.
# Linux is static musl and non-PIE, so it starts on any x86-64 or arm64 Linux, Alpine too
# (npm/README.md, "Linux libc"). Each Linux tsc builds natively on a Blacksmith runner of its arch.
# Windows (x86_64-pc-windows-msvc) builds on a Blacksmith Windows runner, in Git Bash, with the C
# runtime linked in (+crt-static), so tsc.exe needs no Visual C++ redistributable. jemalloc does
# not build there: it uses the system allocator.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "npm/**"
      - "scripts/goport/npm-pack.sh"
      - "scripts/goport/pgo-train.sh"
      - "crates/ts_goport/scripts/copy-libs.sh"
      - "crates/ts_goport/scripts/build-pgo.sh"
      - "LICENSE"
      - "NOTICE.md"
      - "licenses/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The toolchain of crates/ts_goport/scripts/build-release.sh.
  RUSTUP_TOOLCHAIN: 1.95.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            v=${GITHUB_REF_NAME#v}
            [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
            # 0.0.x are the npm placeholders (npm/trust-setup.sh); the publish would skip them.
            [[ $v != 0.0.* ]] || { echo "::error::0.0.x versions are the npm placeholders"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            v=0.0.0-ci.$GITHUB_RUN_NUMBER
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version $v"

  build:
    name: build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: blacksmith-16vcpu-ubuntu-2404
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: blacksmith-16vcpu-ubuntu-2404-arm
          # jemalloc does not cross-build for macOS with zig, so this builds on a Mac.
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: blacksmith-12vcpu-macos-26
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: blacksmith-16vcpu-windows-2025
            exe: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # Git Bash on Windows.
    defaults:
      run:
        shell: bash
    steps:
      # LF in the working tree, as on the other hosts (README.md, "Develop on Windows").
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # llvm-tools: the llvm-profdata of this rustc's LLVM (build-pgo.sh checks it).
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target ${{ matrix.target }} --component llvm-tools
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      # As build-release.sh: the musl build compiles jemalloc with musl-gcc, links static with no PIE,
      # and has bin/tsgo.rs JEMALLOC_CONF built in, so the tsc does not exec itself at start. No
      # GOPORT_BUILD_VERSION: the tsc reports the TypeScript version, which typesVersions matching
      # reads (npm/README.md, "tsc-rs releases"). Both builds below use this environment.
      - name: Build environment
        if: runner.os == 'Linux'
        run: |
          conf=$(sed -n 's/^const JEMALLOC_CONF: &str = "\([^"]*\)";$/\1/p' crates/ts_goport/src/bin/tsgo.rs | head -1)
          [[ -n $conf ]] || { echo "::error::no JEMALLOC_CONF in bin/tsgo.rs"; exit 1; }
          echo "JEMALLOC_SYS_WITH_MALLOC_CONF=$conf" >> "$GITHUB_ENV"
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
          # jemalloc stops at start when the kernel page is bigger than its build page. arm64 kernels
          # use 4, 16 or 64 KiB pages; 2^16 covers all three.
          [[ $target != aarch64-* ]] || echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> "$GITHUB_ENV"
      # The plain tsc: the reference of the PGO check below. PGO_LINK is the link mode of both builds
      # (build-pgo.sh): static on Linux, crt-static on Windows.
      - name: Build
        run: |
          case $RUNNER_OS in
            Linux) export RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static" PGO_LINK=static ;;
            Windows) export RUSTFLAGS="-C target-feature=+crt-static" PGO_LINK=crt-static ;;
          esac
          echo "PGO_LINK=${PGO_LINK:-}" >> "$GITHUB_ENV"
          cargo build --profile goport --locked -p ts_goport --bin tsgo --features noembed --target ${{ matrix.target }}
          mkdir -p "$RUNNER_TEMP/plain"
          cp "target/${{ matrix.target }}/goport/tsgo${{ matrix.exe }}" "$RUNNER_TEMP/plain/tsc${{ matrix.exe }}"
      - name: PGO training set
        run: scripts/goport/pgo-train.sh setup "$RUNNER_TEMP/train"
      # The same build with -Cprofile-generate, the training set, then -Cprofile-use. PGO_LINK (from
      # the Build step) gives the RUSTFLAGS of the plain build. Separate target dirs (not cached).
      - name: PGO build
        env:
          PGO_TARGET: ${{ matrix.target }}
          PGO_BINS: tsgo
          PGO_CARGO: cargo
          CARGO_FEATURES: --features noembed
        run: |
          PGO_TRAIN="scripts/goport/pgo-train.sh run $RUNNER_TEMP/train" crates/ts_goport/scripts/build-pgo.sh "$RUNNER_TEMP/pgo"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/pgo/target-use/goport/tsgo${{ matrix.exe }}" "$RUNNER_TEMP/out/tsc${{ matrix.exe }}"
      - name: Check the PGO tsc against the plain tsc
        run: scripts/goport/pgo-train.sh compare "$RUNNER_TEMP/train" "$RUNNER_TEMP/plain/tsc${{ matrix.exe }}" "$RUNNER_TEMP/out/tsc${{ matrix.exe }}"
      - name: Check the tsc
        env:
          EXE: ${{ matrix.exe }}
        run: |
          out="$RUNNER_TEMP/out"
          dir="$RUNNER_TEMP/check"
          crates/ts_goport/scripts/copy-libs.sh "$dir"
          cp "$out/tsc$EXE" "$dir/tsc$EXE"
          [[ $("$dir/tsc$EXE" --version) == "Version 7."* ]]
          # The tsc prints C:/... paths on Windows.
          listed=$dir/lib.es5.d.ts
          [[ $RUNNER_OS != Windows ]] || listed=$(cygpath -m "$listed")
          cd "$RUNNER_TEMP"
          echo 'const x: number = "a";' > a.ts
          "$dir/tsc$EXE" --listFilesOnly --lib es5 a.ts | grep -qx "$listed"
          set +e
          "$dir/tsc$EXE" --noEmit a.ts > check.txt
          rc=$?
          set -e
          cat check.txt
          [[ $rc == 2 ]] && grep -q "error TS2322" check.txt
          if [[ $RUNNER_OS == Linux ]]; then
            file "$dir/tsc" | tee /dev/stderr | grep -q "statically linked"
            # Static: it starts on musl (Alpine) too.
            docker run --rm -v "$dir:/t:ro" alpine:3 /t/tsc --version
          fi
          # +crt-static: no import of the Visual C++ runtime DLL.
          if [[ $RUNNER_OS == Windows ]] && grep -qai 'vcruntime140' "$dir/tsc.exe"; then
            echo "::error::tsc.exe imports the Visual C++ runtime (vcruntime140.dll)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/tsc${{ matrix.exe }}
          if-no-files-found: error

  package:
    needs: [version, build]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # main's Go pin, as ci.yml resolves it.
      - name: Resolve the Go pin
        id: pin
        run: |
          key=$(jq -r '.batch.upstreamPin.to // empty' docs/typechecker-state/current.json)
          python3 scripts/upstream/pin.py show ${key:+"$key"} > "$RUNNER_TEMP/pin.json"
          jq -r '"key=\(.key)", "repo=\(.repo)", "commit=\(.commit)", "subdir=\(.subdir // "")"' "$RUNNER_TEMP/pin.json" >> "$GITHUB_OUTPUT"
      # npm-pack.sh reads the pin's package input (packages/), its lib files, its LICENSE.txt and
      # NOTICE.txt, and builds the JS API with the repo's own tsc (npm workspaces at the root).
      - name: Check out the pinned Go source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: go-pin
          sparse-checkout: |
            packages
            ${{ steps.pin.outputs.subdir }}/internal/bundled/libs
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: go-pin
      - uses: actions/download-artifact@v5
        with:
          pattern: tsc-*
          path: ${{ runner.temp }}/bins
      - name: Pack
        env:
          GOPORT_PIN: ${{ steps.pin.outputs.key }}
          NPM_PACK_GO_DIR: ${{ github.workspace }}/go-pin/${{ steps.pin.outputs.subdir }}
        run: |
          bins="$RUNNER_TEMP/bins"
          chmod +x "$bins"/tsc-*/tsc "$bins"/tsc-*/tsc.exe
          scripts/goport/npm-pack.sh --name tsc-rs --package-version "$VERSION" \
            --also "linux-arm64=$bins/tsc-linux-arm64/tsc" --also "darwin-arm64=$bins/tsc-darwin-arm64/tsc" \
            --also "win32-x64=$bins/tsc-win32-x64/tsc.exe" \
            "$RUNNER_TEMP/pkg" "$bins/tsc-linux-x64/tsc"
      # One archive per platform: the platform package's lib dir (tsc and the lib files, which a
      # noembed tsc reads next to it), LICENSE and NOTICE.txt. A .tar.gz, and a .zip for Windows.
      - name: Archives
        run: |
          pkg="$RUNNER_TEMP/pkg" dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for platform in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            name="tsc-rs-$VERSION-$platform"
            mkdir -p "$RUNNER_TEMP/archive/$name"
            cp -r "$pkg/tsc-rs-$platform/lib/." "$pkg/tsc-rs-$platform/LICENSE" "$pkg/tsc-rs-$platform/NOTICE.txt" "$RUNNER_TEMP/archive/$name/"
            if [[ $platform == win32-* ]]; then
              (cd "$RUNNER_TEMP/archive" && python3 -m zipfile -c "$dist/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP/archive" -czf "$dist/$name.tar.gz" "$name"
            fi
          done
          cp "$pkg"/*.tgz "$dist/"
          (cd "$dist" && sha256sum -- *.tgz *.tar.gz *.zip > SHA256SUMS)
          cat "$dist/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  # Installs the npm packages in a fresh project on each platform, as a user would. These are
  # GitHub-hosted runners, so the check runs on another host than the build. ubuntu-24.04-arm is
  # GitHub's arm64 standard runner (2 vCPU in a private repo, 4 in a public one).
  verify:
    name: verify (${{ matrix.platform }})
    needs: [version, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
          - platform: win32-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # Git Bash on Windows.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: ${{ runner.temp }}/dist
      - name: npm install and check
        run: |
          dist="$RUNNER_TEMP/dist"
          [[ $RUNNER_OS != Windows ]] || dist=$(cygpath -m "$dist")
          mkdir proj && cd proj
          echo '{"name":"smoke","private":true}' > package.json
          # The other platform's package is not on npm yet: --offline skips that optional dependency.
          npm install --offline --no-audit --no-fund "$dist/tsc-rs-${{ matrix.platform }}-$VERSION.tgz" "$dist/tsc-rs-$VERSION.tgz"
          npx tsc-rs --version
          echo 'export const x: number = 1;' > ok.ts
          npx tsc-rs --noEmit --strict ok.ts
          echo 'const x: number = "a";' > bad.ts
          set +e
          npx tsc-rs --noEmit bad.ts > check.txt
          rc=$?
          set -e
          cat check.txt
          [[ $rc == 2 ]] && grep -q "error TS2322" check.txt
          # Emit.
          npx tsc-rs --outDir out --declaration ok.ts
          cat out/ok.js out/ok.d.ts
          grep -q "export const x = 1;" out/ok.js
      - name: Archive check
        if: runner.os != 'Windows'
        run: |
          dist="$RUNNER_TEMP/dist"
          tar -xzf "$dist/tsc-rs-$VERSION-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/tsc-rs-$VERSION-${{ matrix.platform }}/tsc" --version
      - name: Archive check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "tsc-rs-$env:VERSION-${{ matrix.platform }}"
          Expand-Archive "$env:RUNNER_TEMP\dist\$name.zip" $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\$name\tsc.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, verify]
    # Trusted publishing needs a GitHub-hosted runner. The environment is part of the trust: add
    # required reviewers to it in the repo settings to approve each publish.
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11 && npm --version
      - uses: actions/download-artifact@v5
        with:
          name: release
          path: dist
      # Platform packages first, then the main package that depends on them. A version that is
      # already on npm is skipped, so a failed run can run again. While the repo is private, npm
      # makes no provenance; from a public repo it adds it by itself.
      # A version with a prerelease part (a "-") is a prerelease: dist-tag `next`. Else `latest`.
      - name: Publish to npm
        run: |
          tag=latest
          [[ $VERSION != *-* ]] || tag=next
          echo "dist-tag $tag"
          for pkg in @tsc-rs/linux-x64:tsc-rs-linux-x64 @tsc-rs/linux-arm64:tsc-rs-linux-arm64 \
            @tsc-rs/darwin-arm64:tsc-rs-darwin-arm64 @tsc-rs/win32-x64:tsc-rs-win32-x64 tsc-rs:tsc-rs; do
            name=${pkg%%:*} file=./dist/${pkg#*:}-$VERSION.tgz
            [[ -f $file ]] || { echo "::error::missing package $file"; exit 1; }
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              npm publish "$file" --tag "$tag" --access public
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=() install="npm install -D tsc-rs"
          [[ $VERSION != *-* ]] || pre=(--prerelease) install="npm install -D tsc-rs@next"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${pre[@]}" \
            --title "tsc-rs $VERSION" --generate-notes \
            --notes "Install with \`$install\`, or download the archive for your platform."
