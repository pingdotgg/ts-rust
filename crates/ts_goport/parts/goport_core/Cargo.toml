# The port below the language service: everything of ts_goport but api, cmd,
# format, ls, lsp and project (crate split step 2). Its files stay in
# crates/ts_goport/src; the crate root lists them.
[package]
name = "goport_core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "../../src/goport_core_root.rs"

[dependencies]
# No default features: `lib-snapshot` below turns its part on.
goport_util = { path = "../goport_util", default-features = false }
rustc-hash = "=2.1.2"
indexmap = "=2.14.0"
memchr = "=2.8.2"
smallvec = "=1.15.1"
bumpalo = "=3.20.3"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
flate2 = "=1.1.10"
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }

# Native only: wasm has no processes, signals, terminals or pipes (see
# crates/ts_wasm).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustix = { version = "=1.1.5", features = ["event", "fs", "pipe", "process", "stdio", "termios"] }
# Go `os/signal` Notify for `signal.NotifyContext` in cmd/tsc (--watch, --lsp).
signal-hook = "=0.4.4"

# jemalloc does not build for Windows (msvc, or gnu through zig) or wasm; the
# `jemalloc` feature does nothing there.
[target.'cfg(not(any(windows, target_family = "wasm")))'.dependencies]
# `thread.arena` through its safe `Access` API (program.rs
# `jemalloc_thread_arena`): the one checker of `--singleThreaded` allocates
# in the arena of the loading thread.
tikv-jemalloc-ctl = { version = "=0.7.0", optional = true }

# ipc/transport.rs: Windows named pipes for `--pipe` (Go `winio.ListenPipe`),
# through miow's safe `NamedPipe` API. execute/tsc/compile.rs: Go
# `os.SameFile` in the Windows `LookPath`. No `unsafe` here (D-W1).
[target.'cfg(windows)'.dependencies]
# Go `time.Local` on Windows (time/zoneinfo_windows.go) asks the system for
# its zone. jiff does the same with `tz-system`; Windows has no zoneinfo
# files, so the zone data comes with the binary. See
# execute/tsc/diagnostics.rs `init_local`.
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform"] }
miow = "=0.6.1"
same-file = "=1.0.6"

# `process`: prctl(PR_SET_THP_DISABLE) in thp_guard.rs. `signal`: the
# signal mask at start in bin/tsgo.rs (`unblock_go_signals`).
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[features]
# No `jemalloc`: ts_goport chooses the global allocator (its `jemalloc`
# feature turns on this one), so the two crates cannot disagree about it.
default = ["lib-snapshot", "backtrace"]
# The binaries' global allocator is jemalloc: thread arenas
# (`tikv-jemalloc-ctl`), `jemalloc_layout`, and the jemalloc thread budget
# and glibc tunables in program.rs. Only ts_goport's `jemalloc` turns it on.
jemalloc = ["dep:tikv-jemalloc-ctl"]
noembed = ["goport_util/noembed"]
# The embedded lib parse and bind snapshots (binder/lib_snapshot.rs,
# frontend/parser/lib_parse_snapshot.rs). Off (lust dev builds,
# .lust.toml), every lib parses and binds live, with the same output.
lib-snapshot = ["goport_util/lib-snapshot"]
# Real backtraces (src/backtrace.rs in goport_util).
backtrace = ["goport_util/backtrace"]

[lints]
workspace = true
