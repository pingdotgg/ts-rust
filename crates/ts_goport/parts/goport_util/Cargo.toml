# The bottom part of ts_goport: Go std pieces, tspath, vfs, json, fswatch,
# jsonrpc, diag, locale, astdata, diagnostics and jsnum. Its files stay in
# crates/ts_goport/src; the crate root lists them.
[package]
name = "goport_util"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "../../src/goport_util_root.rs"

[dependencies]
rustc-hash = "=2.1.2"
indexmap = "=2.14.0"
memchr = "=2.8.2"
# jsnum.rs (was the ts_jsnum crate).
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
ryu-js = "=1.0.2"

# wasm only: frontend/bundled/embed.rs unpacks the libs that build.rs packs.
# Its LZMA decoder is about twice as fast as lzma-rs's on wasm (lib.dom and
# lib.es5: about 20 ms, not 45 ms) and 7 KB larger.
[target.'cfg(target_family = "wasm")'.dependencies]
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std"] }
# wasm only: ryu-js's smaller tables for number to string (jsnum.rs). It
# gives the same digits, a little slower, and the module is 10 KB smaller
# with gzip.
ryu-js = { version = "=1.0.2", features = ["small"] }

# build.rs packs the libs of the wasm build. Native builds run build.rs too,
# but it does nothing for them.
[build-dependencies]
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "encoder", "optimization"] }

# Native only (see ts_goport's Cargo.toml).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustix = { version = "=1.1.5", features = ["event", "fs", "pipe", "process", "termios"] }

# fswatch/canonicalize_darwin.rs: NFC for macOS watch paths (Go calls
# CoreFoundation). The dev-dependency builds it into this crate's own tests
# on every target, so its Go unit tests run on Linux.
[target.'cfg(target_vendor = "apple")'.dependencies]
unicode-normalization = "=0.1.25"

[dev-dependencies]
unicode-normalization = "=0.1.25"

# fswatch/unix.rs (Linux only): fanotify_init/fanotify_mark and
# name_to_handle_at, which rustix does not wrap (safe APIs; see the module
# comment).
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fanotify"] }
name-to-handle-at = "=0.1.0"

# fswatch/unix_bsd.rs (darwin and the BSDs): kqueue(2) and kevent(2) for
# the kqueue backend (safe API: `nix::sys::event::Kqueue`).
[target.'cfg(any(target_vendor = "apple", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["event"] }

# fswatch/fsevents_darwin.rs: the FSEvents stream through notify's safe
# `FsEventWatcher` (see the module comment).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }

# fswatch/windows.rs: ReadDirectoryChangesW through notify's safe
# `ReadDirectoryChangesWatcher` (see the module comment).
[target.'cfg(windows)'.dependencies]
notify = { version = "=8.2.0", default-features = false }

[features]
default = ["lib-snapshot", "backtrace"]
# The compile-time hash of each snapshot lib text (frontend/bundled/embed.rs
# `embedded_text_hash`). Build it through ts_goport's feature.
lib-snapshot = []
# Real backtraces in panic logs, panic replies and GOPORT_TRACE output
# (src/backtrace.rs). Off (lust dev builds, .lust.toml), each gives a fixed
# text. Build it through ts_goport's feature.
backtrace = []
# Go build tag `noembed`: the lib files are read from next to the binary, not
# embedded (src/frontend/bundled.rs). Build it through ts_goport's feature.
noembed = []

[lints]
workspace = true
