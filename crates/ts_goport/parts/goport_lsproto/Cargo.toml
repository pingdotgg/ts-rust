# Go internal/lsp/lsproto of ts_goport, with the generated protocol types.
# Its files stay in crates/ts_goport/src/lsp/lsproto; the crate root lists
# them.
[package]
name = "goport_lsproto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "../../src/goport_lsproto_root.rs"

[dependencies]
goport_util = { path = "../goport_util", default-features = false }
rustc-hash = "=2.1.2"
indexmap = "=2.14.0"

[lints]
workspace = true
